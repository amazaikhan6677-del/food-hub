<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin - FoodHub{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-brand"><i class="fa-solid fa-burger"></i> Food<span>Hub</span> <small>Admin</small></div>
    <ul class="admin-nav">
      <li><a href="{{ url_for('admin_dashboard') }}" class="{{ 'active' if active=='dashboard' }}"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
      <li><a href="{{ url_for('admin_orders') }}" class="{{ 'active' if active=='orders' }}"><i class="fa-solid fa-receipt"></i> Orders</a></li>
      <li><a href="{{ url_for('admin_menu') }}" class="{{ 'active' if active=='menu' }}"><i class="fa-solid fa-utensils"></i> Menu</a></li>
      <li><a href="{{ url_for('admin_customers') }}" class="{{ 'active' if active=='customers' }}"><i class="fa-solid fa-users"></i> Customers</a></li>
      <li><a href="{{ url_for('admin_payments') }}" class="{{ 'active' if active=='payments' }}"><i class="fa-solid fa-credit-card"></i> Payments</a></li>
      <li><a href="{{ url_for('admin_offers') }}" class="{{ 'active' if active=='offers' }}"><i class="fa-solid fa-tags"></i> Offers</a></li>
      <li class="mt-4"><a href="{{ url_for('index') }}"><i class="fa-solid fa-house"></i> View Website</a></li>
      <li><a href="{{ url_for('admin_logout') }}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
    </ul>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h4>{% block page_title %}Dashboard{% endblock %}</h4>
    </div>
    <div class="admin-content">
      {% block admin_content %}{% endblock %}
    </div>
  </main>
</div>
<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
