{% extends "admin/base_admin.html" %}
{% set active = "menu" %}
{% block page_title %}Menu Management{% endblock %}
{% block admin_content %}

<div class="admin-panel mb-4">
  <h6 class="mb-3">Add New Food Item</h6>
  <form id="addFoodForm" enctype="multipart/form-data">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="name" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">Price (Rs.)</label>
        <input type="number" step="0.01" class="form-control" name="price" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Category</label>
        <select class="form-select" name="category_id" required>
          {% for c in categories %}
          <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Image</label>
        <input type="file" class="form-control" name="image" accept="image/*">
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="2"></textarea>
      </div>
    </div>
    <button type="submit" class="btn fh-btn-primary mt-3"><i class="fa-solid fa-plus me-1"></i>Add Item</button>
  </form>
</div>

<div class="admin-panel">
  <h6 class="mb-3">All Menu Items</h6>
  <div class="table-responsive">
    <table class="table admin-table align-middle">
      <thead>
        <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Available</th><th>Deal</th><th>Popular</th><th>Actions</th></tr>
      </thead>
      <tbody id="menuTableBody"></tbody>
    </table>
  </div>
</div>

<!-- Edit Food Item Modal -->
<div class="modal fade" id="editFoodModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editFoodForm" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title">Edit Food Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="item_id" id="editItemId">
          <div class="mb-3 text-center">
            <img id="editCurrentImage" src="" alt="" style="width:110px;height:90px;object-fit:cover;border-radius:10px;">
          </div>
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" id="editName" required>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Price (Rs.)</label>
              <input type="number" step="0.01" class="form-control" name="price" id="editPrice" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Category</label>
              <select class="form-select" name="category_id" id="editCategory" required>
                {% for c in categories %}
                <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="mb-3 mt-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" id="editDescription" rows="2"></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label">Replace Image (optional)</label>
            <input type="file" class="form-control" name="image" accept="image/*">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remove_image" value="true" id="editRemoveImage">
            <label class="form-check-label small" for="editRemoveImage">Remove current photo (reset to default category image)</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn fh-btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
{% block extra_js %}
<script>window.FH_ADMIN_PAGE = "menu";</script>
{% endblock %}
