{% extends "base.html" %}
{% block title %}Login - FoodHub{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="fh-auth-card">
        <h3 class="text-center mb-1"><i class="fa-solid fa-burger text-danger"></i> Welcome Back</h3>
        <p class="text-center text-muted mb-4">Login to continue ordering</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <button type="submit" class="btn fh-btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
