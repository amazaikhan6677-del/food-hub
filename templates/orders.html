{% extends "base.html" %}
{% block title %}My Orders - FoodHub{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row g-4">
    <div class="col-lg-3">
      <div class="fh-dash-sidebar">
        <div class="text-center mb-3">
          <i class="fa-solid fa-circle-user fa-4x text-danger"></i>
          <h6 class="mt-2 mb-0">{{ current_user.name }}</h6>
          <small class="text-muted">{{ current_user.email }}</small>
        </div>
        <ul class="list-unstyled fh-dash-menu">
          <li class="active"><i class="fa-solid fa-receipt"></i> My Orders</li>
          <li><i class="fa-solid fa-user"></i> Profile</li>
          <li><i class="fa-solid fa-location-dot"></i> Saved Address</li>
          <li><a href="{{ url_for('logout') }}" class="text-danger text-decoration-none"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>
      </div>
    </div>
    <div class="col-lg-9">
      <h1 class="fh-section-title mb-4">Order History</h1>
      <div id="ordersList"></div>
      <div id="ordersEmpty" class="text-center py-5 d-none">
        <i class="fa-solid fa-receipt fa-3x text-muted mb-3"></i>
        <h5>No orders yet</h5>
        <a href="{{ url_for('menu') }}" class="btn fh-btn-primary mt-2">Order Now</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
{% block extra_js %}
<script>window.FH_PAGE = "orders";</script>
{% endblock %}
