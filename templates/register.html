{% extends "base.html" %}
{% block title %}Register - FoodHub{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="fh-auth-card">
        <h3 class="text-center mb-1"><i class="fa-solid fa-burger text-danger"></i> Create Account</h3>
        <p class="text-center text-muted mb-4">Join FoodHub and start ordering</p>
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" name="name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" class="form-control" name="phone" required>
            </div>
            <div class="col-12">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" name="password" required minlength="6">
            </div>
            <div class="col-md-6">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-control" name="confirm_password" required minlength="6">
            </div>
          </div>
          <button type="submit" class="btn fh-btn-primary w-100 mt-4">Register</button>
        </form>
        <p class="text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
